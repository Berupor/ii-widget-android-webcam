# A phone plugged in as a USB webcam goes through openeffectsd and comes out at
# /dev/video10, so its raw node has no business in the PipeWire graph. With the node
# there, WirePlumber links every camera to the bridge's pipewiresrc, PipeWire opens
# /dev/video* first about half the time, and openeffectsd then fails with
# `Device is busy` and quietly publishes a 640x360 test pattern instead.
#
# The card name is the kernel's for any Android phone in UVC mode, the same string the
# widget itself watches for.
monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.cap.card = "~.*: Android Webcam"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
